<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kulzzy Celebrant Slider</title>

<style>

/* =========================================
   BASIC RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 0;

    background: transparent;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================
   MAIN SLIDER
   25 : 35 PORTRAIT RATIO
========================================= */

.celebrant-slider {

    position: relative;

    width: 100%;

    /*
       25:35 = 0.7142857
       Height = width × 35 / 25
    */

    aspect-ratio: 25 / 35;

    margin: 0 auto;

    overflow: hidden;

    border-radius: 10px;

    background: #07152f;

    display: none;
}


/* =========================================
   SLIDE
========================================= */

.slide {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    opacity: 0;

    visibility: hidden;

    transform: scale(1.02);

    transition:
        opacity 0.8s ease,
        transform 4s ease,
        visibility 0.8s ease;
}


.slide.active {

    opacity: 1;

    visibility: visible;

    transform: scale(1);
}


/* =========================================
   CELEBRANT IMAGE
========================================= */

.slide img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center center;
}


/* =========================================
   IMAGE OVERLAY
========================================= */

.slide::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 45%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0, 0, 0, 0.88)
        );

    pointer-events: none;
}


/* =========================================
   CELEBRANT INFORMATION
========================================= */

.slide-info {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 3;

    padding:
        35px
        14px
        13px;
}


.celebrant-name {

    margin: 0;

    color: #ffffff;

    font-size: 20px;

    line-height: 1.15;

    font-weight: 900;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,0.9);
}


/* =========================================
   KULZZY LABEL
========================================= */

.kulzzy-label {

    display: inline-block;

    max-width: 80%;

    margin-top: 6px;

    padding:
        4px 8px;

    border-radius: 5px;

    background: #ffd21c;

    color: #07152f;

    font-size: 8px;

    line-height: 1.2;

    font-weight: 900;

    text-transform: uppercase;
}


/* =========================================
   DOTS
========================================= */

.slider-dots {

    position: absolute;

    right: 12px;

    bottom: 12px;

    z-index: 10;

    display: flex;

    gap: 5px;
}


.dot {

    width: 6px;

    height: 6px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.55);

    transition:
        all 0.3s ease;
}


.dot.active {

    background: #ffd21c;

    transform: scale(1.3);
}


/* =========================================
   LOADING
========================================= */

.loading {

    width: 100%;

    aspect-ratio: 25 / 35;

    margin: 0 auto;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #07152f;

    border-radius: 10px;

    color: #ffd21c;

    font-size: 13px;

    font-weight: 700;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .celebrant-slider {

        width: 100%;

        aspect-ratio: 25 / 35;

        border-radius: 8px;
    }


    .loading {

        width: 100%;

        aspect-ratio: 25 / 35;
    }


    .celebrant-name {

        font-size: 18px;
    }


    .slide-info {

        padding:
            30px
            12px
            12px;
    }

}


/* =========================================
   SMALL PHONES
========================================= */

@media (max-width: 400px) {

    .celebrant-name {

        font-size: 17px;
    }


    .slide-info {

        padding:
            28px
            10px
            10px;
    }

}


/* =========================================
   VERY SMALL PHONES
========================================= */

@media (max-width: 340px) {

    .celebrant-name {

        font-size: 16px;
    }

}

</style>

</head>


<body>


<!-- ======================================
     LOADING
======================================= -->

<div
    class="loading"
    id="loading"
>
    🎉 kulzzy radio services...
</div>


<!-- ======================================
     SLIDER
======================================= -->

<div
    class="celebrant-slider"
    id="celebrantSlider"
>

    <div
        id="slidesContainer"
    ></div>


    <div
        class="slider-dots"
        id="sliderDots"
    ></div>

</div>


<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {

    initializeApp

} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

    getFirestore,

    collection,

    getDocs

} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDHI9tGBt_B5yCK45K-angMPwTlUwTrfIQ",

    authDomain:
        "kulzzy-celebrant-slider.firebaseapp.com",

    projectId:
        "kulzzy-celebrant-slider",

    storageBucket:
        "kulzzy-celebrant-slider.firebasestorage.app",

    messagingSenderId:
        "109098527853",

    appId:
        "1:109098527853:web:79613ac1407856f112e364",

    measurementId:
        "G-7Z0WJFH5X0"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


/* =========================================
   ELEMENTS
========================================= */

const slider =
    document.getElementById(
        "celebrantSlider"
    );


const loading =
    document.getElementById(
        "loading"
    );


const slidesContainer =
    document.getElementById(
        "slidesContainer"
    );


const dotsContainer =
    document.getElementById(
        "sliderDots"
    );


/* =========================================
   SLIDER VARIABLES
========================================= */

let slides = [];

let dots = [];

let currentSlide = 0;

let slideTimer = null;


/* =========================================
   LOAD CELEBRANTS
========================================= */

async function loadCelebrants() {

    try {

        const snapshot =
            await getDocs(

                collection(
                    db,
                    "celebrants"
                )

            );


        const activeCelebrants = [];


        /* =====================================
           READ CELEBRANTS
        ===================================== */

        snapshot.forEach(

            function(doc) {

                const data =
                    doc.data();


                if (
                    !data.images ||
                    !Array.isArray(
                        data.images
                    )
                ) {

                    return;

                }


                if (
                    data.published !== true
                ) {

                    return;

                }


                activeCelebrants.push(
                    data
                );

            }

        );


        /* =====================================
           CLEAR OLD SLIDES
        ===================================== */

        slidesContainer.innerHTML = "";

        dotsContainer.innerHTML = "";

        slides = [];

        dots = [];

        currentSlide = 0;


        /* =====================================
           NO CELEBRANTS
        ===================================== */

        if (
            activeCelebrants.length === 0
        ) {

            slider.style.display =
                "none";


            loading.style.display =
                "none";


            stopSlider();


            return;

        }


        /* =====================================
           CREATE SLIDES
        ===================================== */

        activeCelebrants.forEach(

            function(celebrant) {

                const name =
                    celebrant.name ||
                    "Today's Celebrant";


                celebrant.images.forEach(

                    function(imageUrl) {

                        if (
                            !imageUrl ||
                            typeof imageUrl !==
                            "string"
                        ) {

                            return;

                        }


                        createSlide(
                            imageUrl,
                            name
                        );

                    }

                );

            }

        );


        /* =====================================
           GET SLIDES
        ===================================== */

        slides =
            Array.from(

                document.querySelectorAll(
                    ".slide"
                )

            );


        dots =
            Array.from(

                document.querySelectorAll(
                    ".dot"
                )

            );


        /* =====================================
           SHOW SLIDER
        ===================================== */

        if (
            slides.length > 0
        ) {

            loading.style.display =
                "none";


            slider.style.display =
                "block";


            showSlide(
                0
            );


            startSlider();

        } else {

            slider.style.display =
                "none";


            loading.style.display =
                "none";

        }


    } catch (error) {

        console.error(
            "Celebrant loading error:",
            error
        );


        slider.style.display =
            "none";


        loading.style.display =
            "none";

    }

}


/* =========================================
   CREATE SLIDE
========================================= */

function createSlide(
    imageUrl,
    name
) {

    const slide =
        document.createElement(
            "div"
        );


    slide.className =
        "slide";


    /* =====================================
       IMAGE
    ===================================== */

    const image =
        document.createElement(
            "img"
        );


    image.src =
        imageUrl;


    image.alt =
        name;


    image.loading =
        "lazy";


    image.style.objectPosition =
        "center center";


    /* =====================================
       INFORMATION
    ===================================== */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "slide-info";


    const title =
        document.createElement(
            "h2"
        );


    title.className =
        "celebrant-name";


    title.textContent =
        name;


    const label =
        document.createElement(
            "span"
        );


    label.className =
        "kulzzy-label";


    label.textContent =
        "Who do you want us to celebrate for you today";


    info.appendChild(
        title
    );


    info.appendChild(
        label
    );


    /* =====================================
       BUILD SLIDE
    ===================================== */

    slide.appendChild(
        image
    );


    slide.appendChild(
        info
    );


    slidesContainer.appendChild(
        slide
    );


    /* =====================================
       DOT
    ===================================== */

    const dot =
        document.createElement(
            "div"
        );


    dot.className =
        "dot";


    dotsContainer.appendChild(
        dot
    );

}


/* =========================================
   SHOW SLIDE
========================================= */

function showSlide(
    index
) {

    if (
        slides.length === 0
    ) {

        return;

    }


    slides.forEach(

        function(slide) {

            slide.classList.remove(
                "active"
            );

        }

    );


    dots.forEach(

        function(dot) {

            dot.classList.remove(
                "active"
            );

        }

    );


    if (
        slides[index]
    ) {

        slides[index].classList.add(
            "active"
        );

    }


    if (
        dots[index]
    ) {

        dots[index].classList.add(
            "active"
        );

    }


    currentSlide =
        index;

}


/* =========================================
   START SLIDER
========================================= */

function startSlider() {

    stopSlider();


    if (
        slides.length <= 1
    ) {

        return;

    }


    slideTimer =
        setInterval(

            function() {

                let next =
                    currentSlide + 1;


                if (
                    next >= slides.length
                ) {

                    next = 0;

                }


                showSlide(
                    next
                );

            },

            4000

        );

}


/* =========================================
   STOP SLIDER
========================================= */

function stopSlider() {

    if (
        slideTimer
    ) {

        clearInterval(
            slideTimer
        );

        slideTimer =
            null;

    }

}


/* =========================================
   FIRST LOAD
========================================= */

loadCelebrants();


/* =========================================
   REFRESH EVERY 60 SECONDS
========================================= */

setInterval(

    function() {

        loadCelebrants();

    },

    60000

);

</script>


</body>

</html>
