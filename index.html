<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kulzzy Celebrant Slider</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

.celebrant-slider {
    width: 100%;
    max-width: 420px;
    height: 210px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    background: #07152f;
}

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transform: scale(1.02);
    transition:
        opacity 0.8s ease,
        transform 4s ease;
}

.slide.active {
    opacity: 1;
    transform: scale(1);
}

.slide img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
}

.slide-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 35px 15px 13px;
    background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.85)
    );
}

.celebrant-name {
    margin: 0;
    color: #ffffff;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.1;
    text-align: left;
}

.celebrant-message {
    margin: 5px 0 0;
    color: #ffd21c;
    font-size: 13px;
    font-weight: 600;
}

.slider-dots {
    position: absolute;
    bottom: 9px;
    right: 12px;
    display: flex;
    gap: 5px;
    z-index: 10;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
}

.dot.active {
    background: #ffd21c;
    transform: scale(1.2);
}

.empty-message {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="celebrant-slider" id="celebrantSlider">

    <!--
        TEMPORARY TEST SLIDES

        These will later be replaced automatically
        by pictures uploaded through the admin panel.
    -->

    <div class="slide active">
        <img
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85"
            alt="Celebrant">
        <div class="slide-overlay">
            <h2 class="celebrant-name">
                HAPPY BIRTHDAY!
            </h2>
            <p class="celebrant-message">
                Celebrating Lives Everyday
            </p>
        </div>
    </div>

    <div class="slide">
        <img
            src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=85"
            alt="Celebrant">
        <div class="slide-overlay">
            <h2 class="celebrant-name">
                TODAY'S CELEBRANT
            </h2>
            <p class="celebrant-message">
                Celebrating with Kulzzy Radio
            </p>
        </div>
    </div>

    <div class="slide">
        <img
            src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=85"
            alt="Celebrant">
        <div class="slide-overlay">
            <h2 class="celebrant-name">
                CELEBRATE WITH US!
            </h2>
            <p class="celebrant-message">
                Kulzzy Radio Network
            </p>
        </div>
    </div>

    <div class="slider-dots" id="sliderDots"></div>

</div>

<script>
const slides = document.querySelectorAll(".slide");
const dotsContainer = document.getElementById("sliderDots");

let currentSlide = 0;

/* Create dots */
slides.forEach((slide, index) => {
    const dot = document.createElement("div");

    dot.className = "dot";

    if (index === 0) {
        dot.classList.add("active");
    }

    dotsContainer.appendChild(dot);
});

/* Get dots */
const dots = document.querySelectorAll(".dot");

/* Change slide */
function showSlide(index) {

    slides.forEach(slide => {
        slide.classList.remove("active");
    });

    dots.forEach(dot => {
        dot.classList.remove("active");
    });

    slides[index].classList.add("active");
    dots[index].classList.add("active");

    currentSlide = index;
}

/* Automatic sliding */
setInterval(() => {

    let nextSlide = currentSlide + 1;

    if (nextSlide >= slides.length) {
        nextSlide = 0;
    }

    showSlide(nextSlide);

}, 4000);
</script>

</body>
  </html>
