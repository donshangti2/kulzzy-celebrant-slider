<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kulzzy Celebrant Slider</title>

<style>

/* =========================================
   BASIC RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 0;

    background: transparent;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================
   MAIN SLIDER
   25 : 35 PORTRAIT RATIO
========================================= */

.celebrant-slider {

    position: relative;

    width: 100%;

    aspect-ratio: 25 / 35;

    margin: 0 auto;

    overflow: hidden;

    border-radius: 10px;

    background: #07152f;

    display: none;

    touch-action: pan-y;

    user-select: none;

    -webkit-user-select: none;

}


/* =========================================
   SLIDES CONTAINER
========================================= */

#slidesContainer {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

}


/* =========================================
   SLIDE
========================================= */

.slide {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    opacity: 0;

    visibility: hidden;

    transform: translateX(0);

    transition:
        opacity 0.45s ease,
        transform 0.45s ease,
        visibility 0.45s ease;

}


/* =========================================
   ACTIVE SLIDE
========================================= */

.slide.active {

    opacity: 1;

    visibility: visible;

    transform: translateX(0);

}


/* =========================================
   PREVIOUS SLIDE
========================================= */

.slide.previous {

    opacity: 0;

    visibility: hidden;

    transform: translateX(-100%);

}


/* =========================================
   NEXT SLIDE
========================================= */

.slide.next {

    opacity: 0;

    visibility: hidden;

    transform: translateX(100%);

}


/* =========================================
   CELEBRANT IMAGE
   FULL 25:35 IMAGE
========================================= */

.slide img {

    display: block;

    width: 100%;

    height: 100%;

    /*
     * CONTAIN keeps the complete picture.
     * Nothing at the top, bottom or sides
     * will be cut off.
     */

    object-fit: contain;

    object-position: center center;

    background: #07152f;

    pointer-events: none;

}


/* =========================================
   IMAGE OVERLAY
========================================= */

.slide::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 40%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0, 0, 0, 0.90)
        );

    pointer-events: none;

}


/* =========================================
   CELEBRANT INFORMATION
========================================= */

.slide-info {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 3;

    padding:
        35px
        14px
        15px;

    pointer-events: none;

}


.celebrant-name {

    margin: 0;

    color: #ffffff;

    font-size: 20px;

    line-height: 1.15;

    font-weight: 900;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,0.9);

}


/* =========================================
   KULZZY LABEL
========================================= */

.kulzzy-label {

    display: inline-block;

    max-width: 80%;

    margin-top: 6px;

    padding:
        5px 8px;

    border-radius: 5px;

    background: #ffd21c;

    color: #07152f;

    font-size: 8px;

    line-height: 1.2;

    font-weight: 900;

    text-transform: uppercase;

}


/* =========================================
   DOTS
========================================= */

.slider-dots {

    position: absolute;

    right: 12px;

    bottom: 12px;

    z-index: 10;

    display: flex;

    gap: 5px;

}


.dot {

    width: 7px;

    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.55);

    transition:
        all 0.3s ease;

    cursor: pointer;

}


.dot.active {

    background: #ffd21c;

    transform: scale(1.35);

}


/* =========================================
   SWIPE INDICATOR
========================================= */

.swipe-hint {

    position: absolute;

    left: 50%;

    top: 50%;

    z-index: 20;

    transform:
        translate(-50%, -50%);

    padding:
        8px 12px;

    border-radius: 20px;

    background:
        rgba(0,0,0,0.65);

    color: #ffffff;

    font-size: 11px;

    font-weight: 700;

    pointer-events: none;

    opacity: 0.9;

    transition:
        opacity 0.5s ease;

}


.swipe-hint.hidden {

    opacity: 0;

}


/* =========================================
   LOADING
========================================= */

.loading {

    width: 100%;

    aspect-ratio: 25 / 35;

    margin: 0 auto;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #07152f;

    border-radius: 10px;

    color: #ffd21c;

    font-size: 13px;

    font-weight: 700;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .celebrant-slider {

        width: 100%;

        aspect-ratio: 25 / 35;

        border-radius: 8px;

    }


    .loading {

        width: 100%;

        aspect-ratio: 25 / 35;

    }


    .celebrant-name {

        font-size: 18px;

    }


    .slide-info {

        padding:
            30px
            12px
            12px;

    }

}


/* =========================================
   SMALL PHONES
========================================= */

@media (max-width: 400px) {

    .celebrant-name {

        font-size: 17px;

    }


    .slide-info {

        padding:
            28px
            10px
            10px;

    }


    .swipe-hint {

        font-size: 10px;

        padding:
            7px 10px;

    }

}


/* =========================================
   VERY SMALL PHONES
========================================= */

@media (max-width: 340px) {

    .celebrant-name {

        font-size: 16px;

    }

}

</style>

</head>


<body>


<!-- ======================================
     LOADING
======================================= -->

<div
    class="loading"
    id="loading"
>
    🎉 kulzzy radio services...
</div>


<!-- ======================================
     SLIDER
======================================= -->

<div
    class="celebrant-slider"
    id="celebrantSlider"
>

    <div
        id="slidesContainer"
    ></div>


    <div
        class="slider-dots"
        id="sliderDots"
    ></div>


    <div
        class="swipe-hint"
        id="swipeHint"
    >
        ← Swipe to view →
    </div>

</div>


<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {

    initializeApp

} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

    getFirestore,

    collection,

    getDocs

} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDHI9tGBt_B5yCK45K-angMPwTlUwTrfIQ",

    authDomain:
        "kulzzy-celebrant-slider.firebaseapp.com",

    projectId:
        "kulzzy-celebrant-slider",

    storageBucket:
        "kulzzy-celebrant-slider.firebasestorage.app",

    messagingSenderId:
        "109098527853",

    appId:
        "1:109098527853:web:79613ac1407856f112e364",

    measurementId:
        "G-7Z0WJFH5X0"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


/* =========================================
   ELEMENTS
========================================= */

const slider =
    document.getElementById(
        "celebrantSlider"
    );


const loading =
    document.getElementById(
        "loading"
    );


const slidesContainer =
    document.getElementById(
        "slidesContainer"
    );


const dotsContainer =
    document.getElementById(
        "sliderDots"
    );


const swipeHint =
    document.getElementById(
        "swipeHint"
    );


/* =========================================
   SLIDER VARIABLES
========================================= */

let slides = [];

let dots = [];

let currentSlide = 0;


/* =========================================
   TOUCH / MOUSE VARIABLES
========================================= */

let startX = 0;

let currentX = 0;

let isDragging = false;

let dragStarted = false;


/* =========================================
   LOAD CELEBRANTS
========================================= */

async function loadCelebrants() {

    try {

        const snapshot =
            await getDocs(

                collection(
                    db,
                    "celebrants"
                )

            );


        const activeCelebrants = [];


        snapshot.forEach(

            function(doc) {

                const data =
                    doc.data();


                if (
                    !data.images ||
                    !Array.isArray(
                        data.images
                    )
                ) {

                    return;

                }


                if (
                    data.published !== true
                ) {

                    return;

                }


                activeCelebrants.push(
                    data
                );

            }

        );


        /* =====================================
           CLEAR OLD SLIDES
        ===================================== */

        slidesContainer.innerHTML = "";

        dotsContainer.innerHTML = "";

        slides = [];

        dots = [];

        currentSlide = 0;


        /* =====================================
           NO CELEBRANTS
        ===================================== */

        if (
            activeCelebrants.length === 0
        ) {

            slider.style.display =
                "none";


            loading.style.display =
                "none";


            return;

        }


        /* =====================================
           CREATE SLIDES
        ===================================== */

        activeCelebrants.forEach(

            function(celebrant) {

                const name =
                    celebrant.name ||
                    "Today's Celebrant";


                celebrant.images.forEach(

                    function(imageUrl) {

                        if (
                            !imageUrl ||
                            typeof imageUrl !==
                            "string"
                        ) {

                            return;

                        }


                        createSlide(
                            imageUrl,
                            name
                        );

                    }

                );

            }

        );


        /* =====================================
           GET SLIDES
        ===================================== */

        slides =
            Array.from(

                document.querySelectorAll(
                    ".slide"
                )

            );


        dots =
            Array.from(

                document.querySelectorAll(
                    ".dot"
                )

            );


        /* =====================================
           SHOW SLIDER
        ===================================== */

        if (
            slides.length > 0
        ) {

            loading.style.display =
                "none";


            slider.style.display =
                "block";


            showSlide(
                0
            );


            /*
             * Show swipe instruction briefly.
             */

            setTimeout(

                function() {

                    swipeHint.classList.add(
                        "hidden"
                    );

                },

                3500

            );

        } else {

            slider.style.display =
                "none";


            loading.style.display =
                "none";

        }


    } catch (error) {

        console.error(
            "Celebrant loading error:",
            error
        );


        slider.style.display =
            "none";


        loading.style.display =
            "none";

    }

}


/* =========================================
   CREATE SLIDE
========================================= */

function createSlide(
    imageUrl,
    name
) {

    const slide =
        document.createElement(
            "div"
        );


    slide.className =
        "slide";


    /* =====================================
       IMAGE
    ===================================== */

    const image =
        document.createElement(
            "img"
        );


    image.src =
        imageUrl;


    image.alt =
        name;


    image.loading =
        "lazy";


    image.style.objectPosition =
        "center center";


    /* =====================================
       INFORMATION
    ===================================== */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "slide-info";


    const title =
        document.createElement(
            "h2"
        );


    title.className =
        "celebrant-name";


    title.textContent =
        name;


    const label =
        document.createElement(
            "span"
        );


    label.className =
        "kulzzy-label";


    label.textContent =
        "Who do you want us to celebrate for you today";


    info.appendChild(
        title
    );


    info.appendChild(
        label
    );


    /* =====================================
       BUILD SLIDE
    ===================================== */

    slide.appendChild(
        image
    );


    slide.appendChild(
        info
    );


    slidesContainer.appendChild(
        slide
    );


    /* =====================================
       DOT
    ===================================== */

    const dot =
        document.createElement(
            "div"
        );


    dot.className =
        "dot";


    dot.addEventListener(

        "click",

        function() {

            const index =
                dots.indexOf(
                    dot
                );

            if (
                index !== -1
            ) {

                showSlide(
                    index
                );

            }

        }

    );


    dotsContainer.appendChild(
        dot
    );

}


/* =========================================
   SHOW SLIDE
========================================= */

function showSlide(
    index
) {

    if (
        slides.length === 0
    ) {

        return;

    }


    if (
        index < 0
    ) {

        index =
            slides.length - 1;

    }


    if (
        index >= slides.length
    ) {

        index = 0;

    }


    slides.forEach(

        function(slide) {

            slide.classList.remove(
                "active"
            );

            slide.classList.remove(
                "previous"
            );

            slide.classList.remove(
                "next"
            );

        }

    );


    dots.forEach(

        function(dot) {

            dot.classList.remove(
                "active"
            );

        }

    );


    if (
        slides[index]
    ) {

        slides[index].classList.add(
            "active"
        );

    }


    if (
        dots[index]
    ) {

        dots[index].classList.add(
            "active"
        );

    }


    currentSlide =
        index;

}


/* =========================================
   NEXT SLIDE
========================================= */

function nextSlide() {

    if (
        slides.length <= 1
    ) {

        return;

    }


    let next =
        currentSlide + 1;


    if (
        next >= slides.length
    ) {

        next = 0;

    }


    showSlide(
        next
    );

}


/* =========================================
   PREVIOUS SLIDE
========================================= */

function previousSlide() {

    if (
        slides.length <= 1
    ) {

        return;

    }


    let previous =
        currentSlide - 1;


    if (
        previous < 0
    ) {

        previous =
            slides.length - 1;

    }


    showSlide(
        previous
    );

}


/* =========================================
   TOUCH START
========================================= */

slider.addEventListener(

    "touchstart",

    function(event) {

        if (
            event.touches.length !== 1
        ) {

            return;

        }


        startX =
            event.touches[0].clientX;


        currentX =
            startX;


        isDragging =
            true;

    },

    {
        passive: true
    }

);


/* =========================================
   TOUCH MOVE
========================================= */

slider.addEventListener(

    "touchmove",

    function(event) {

        if (
            !isDragging
        ) {

            return;

        }


        currentX =
            event.touches[0].clientX;

    },

    {
        passive: true
    }

);


/* =========================================
   TOUCH END
========================================= */

slider.addEventListener(

    "touchend",

    function() {

        if (
            !isDragging
        ) {

            return;

        }


        const distance =
            currentX - startX;


        isDragging =
            false;


        /*
         * Minimum swipe distance.
         */

        if (
            Math.abs(distance) < 45
        ) {

            return;

        }


        if (
            distance < 0
        ) {

            nextSlide();

        } else {

            previousSlide();

        }

    }

);


/* =========================================
   MOUSE DRAG START
========================================= */

slider.addEventListener(

    "mousedown",

    function(event) {

        startX =
            event.clientX;


        currentX =
            startX;


        isDragging =
            true;

        dragStarted =
            true;


        event.preventDefault();

    }

);


/* =========================================
   MOUSE MOVE
========================================= */

window.addEventListener(

    "mousemove",

    function(event) {

        if (
            !isDragging ||
            !dragStarted
        ) {

            return;

        }


        currentX =
            event.clientX;

    }

);


/* =========================================
   MOUSE UP
========================================= */

window.addEventListener(

    "mouseup",

    function() {

        if (
            !isDragging
        ) {

            return;

        }


        const distance =
            currentX - startX;


        isDragging =
            false;

        dragStarted =
            false;


        if (
            Math.abs(distance) < 45
        ) {

            return;

        }


        if (
            distance < 0
        ) {

            nextSlide();

        } else {

            previousSlide();

        }

    }

);


/* =========================================
   KEYBOARD CONTROL
========================================= */

document.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "ArrowLeft"
        ) {

            previousSlide();

        }


        if (
            event.key === "ArrowRight"
        ) {

            nextSlide();

        }

    }

);


/* =========================================
   FIRST LOAD
========================================= */

loadCelebrants();


/* =========================================
   REFRESH EVERY 60 SECONDS
========================================= */

setInterval(

    function() {

        loadCelebrants();

    },

    60000

);

</script>


</body>

</html>
