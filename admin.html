<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kulzzy Celebrant Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #07152f;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.admin-box {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    background: #0d2145;
    padding: 22px;
    border-radius: 16px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
}

.logo {
    text-align: center;
    margin-bottom: 22px;
}

.logo h1 {
    margin: 0;
    color: #ffd21c;
    font-size: 25px;
    font-weight: 900;
}

.logo p {
    margin: 7px 0 0;
    color: #d7dce6;
    font-size: 13px;
}

.upload-label {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100px;
    padding: 20px;
    border: 2px dashed #ffd21c;
    border-radius: 12px;
    background: rgba(255,210,28,0.05);
    color: #ffd21c;
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    cursor: pointer;
}

#photoInput {
    display: none;
}

.preview-title {
    display: none;
    margin: 18px 0 10px;
    font-size: 14px;
    font-weight: 800;
    color: #ffd21c;
}

.preview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.preview-item {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 8px;
    background: #061127;
}

.preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
}

label.field-label {
    display: block;
    margin: 18px 0 7px;
    font-size: 14px;
    font-weight: 700;
}

input[type="text"] {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 9px;
    outline: none;
    background: #07152f;
    color: #ffffff;
    font-size: 15px;
}

input[type="text"]:focus {
    border-color: #ffd21c;
}

.publish-btn {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #ffd21c;
    color: #07152f;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
}

.publish-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 13px;
    border-radius: 9px;
    text-align: center;
    font-size: 14px;
    line-height: 1.4;
}

.message.success {
    display: block;
    background: rgba(40,180,90,0.15);
    color: #7dffab;
}

.message.error {
    display: block;
    background: rgba(255,60,60,0.15);
    color: #ff9b9b;
}

.progress {
    display: none;
    margin-top: 12px;
    text-align: center;
    color: #ffd21c;
    font-size: 13px;
    font-weight: 700;
}
</style>
</head>

<body>

<div class="admin-box">

    <div class="logo">
        <h1>🎉 KULZZY CELEBRANT</h1>
        <p>Celebrant Slider Admin Panel</p>
    </div>

    <!-- PHOTO SELECTOR -->

    <label
        for="photoInput"
        class="upload-label"
    >
        📸 SELECT CELEBRANT PICTURES
        <br>
        <small style="display:block;margin-top:7px;color:#ffffff;">
            Select one or multiple pictures from your phone
        </small>
    </label>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        multiple
    >

    <!-- PREVIEW -->

    <div
        class="preview-title"
        id="previewTitle"
    >
        🖼️ SELECTED PICTURES
    </div>

    <div
        class="preview-grid"
        id="previewGrid"
    ></div>

    <!-- NAME -->

    <label
        for="celebrantName"
        class="field-label"
    >
        Celebrant Name
    </label>

    <input
        type="text"
        id="celebrantName"
        placeholder="Enter celebrant name"
        autocomplete="off"
    >

    <!-- PROGRESS -->

    <div
        class="progress"
        id="progress"
    >
        Uploading pictures...
    </div>

    <!-- PUBLISH -->

    <button
        class="publish-btn"
        id="publishBtn"
    >
        🎉 PUBLISH CELEBRANT
    </button>

    <div
        class="message"
        id="statusMessage"
    ></div>

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDHI9tGBt_B5yCK45K-angMPwTlUwTrfIQ",

    authDomain:
        "kulzzy-celebrant-slider.firebaseapp.com",

    projectId:
        "kulzzy-celebrant-slider",

    storageBucket:
        "kulzzy-celebrant-slider.firebasestorage.app",

    messagingSenderId:
        "109098527853",

    appId:
        "1:109098527853:web:79613ac1407856f112e364",

    measurementId:
        "G-7Z0WJFH5X0"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================================
   CLOUDINARY
========================================= */

const CLOUD_NAME =
    "s4j0x7dk";

const UPLOAD_PRESET =
    "kulzzy_celebrants";


/* =========================================
   ELEMENTS
========================================= */

const photoInput =
    document.getElementById("photoInput");

const previewGrid =
    document.getElementById("previewGrid");

const previewTitle =
    document.getElementById("previewTitle");

const celebrantName =
    document.getElementById("celebrantName");

const publishBtn =
    document.getElementById("publishBtn");

const statusMessage =
    document.getElementById("statusMessage");

const progress =
    document.getElementById("progress");


let selectedFiles = [];


/* =========================================
   SELECT PICTURES
========================================= */

photoInput.addEventListener(
    "change",
    function() {

        selectedFiles =
            Array.from(photoInput.files);

        showPreviews();

    }
);


/* =========================================
   PREVIEW
========================================= */

function showPreviews() {

    previewGrid.innerHTML = "";

    if (selectedFiles.length === 0) {

        previewTitle.style.display = "none";

        return;
    }

    previewTitle.style.display = "block";


    selectedFiles.forEach(
        function(file) {

            const reader =
                new FileReader();

            reader.onload =
                function(event) {

                    const item =
                        document.createElement("div");

                    item.className =
                        "preview-item";


                    const img =
                        document.createElement("img");

                    img.src =
                        event.target.result;

                    img.alt =
                        "Celebrant picture";


                    item.appendChild(img);

                    previewGrid.appendChild(item);

                };


            reader.readAsDataURL(file);

        }
    );
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type
) {

    statusMessage.textContent =
        text;

    statusMessage.className =
        "message " + type;
}


/* =========================================
   UPLOAD ONE IMAGE
========================================= */

async function uploadToCloudinary(
    file
) {

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        UPLOAD_PRESET
    );


    const response =
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
            {
                method: "POST",
                body: formData
            }
        );


    if (!response.ok) {

        throw new Error(
            "Cloudinary upload failed."
        );

    }


    const data =
        await response.json();


    return data.secure_url;
}


/* =========================================
   PUBLISH
========================================= */

publishBtn.addEventListener(
    "click",
    async function() {

        const name =
            celebrantName.value.trim();


        if (selectedFiles.length === 0) {

            showMessage(
                "Please select at least one celebrant picture.",
                "error"
            );

            return;
        }


        if (!name) {

            showMessage(
                "Please enter the celebrant name.",
                "error"
            );

            return;
        }


        publishBtn.disabled = true;

        publishBtn.textContent =
            "UPLOADING...";

        progress.style.display =
            "block";


        try {

            const imageUrls = [];


            /* ============================
               UPLOAD ALL PICTURES
            ============================ */

            for (
                let i = 0;
                i < selectedFiles.length;
                i++
            ) {

                progress.textContent =
                    `Uploading picture ${i + 1} of ${selectedFiles.length}...`;


                const imageUrl =
                    await uploadToCloudinary(
                        selectedFiles[i]
                    );


                imageUrls.push(
                    imageUrl
                );

            }


            /* ============================
               24 HOUR EXPIRATION
            ============================ */

            const now =
                Date.now();

            const expiresAt =
                now + (24 * 60 * 60 * 1000);


            /* ============================
               SAVE TO FIRESTORE
            ============================ */

            await addDoc(
                collection(
                    db,
                    "celebrants"
                ),
                {

                    name: name,

                    images: imageUrls,

                    published: true,

                    publishedAt: now,

                    expiresAt: expiresAt,

                    createdAt:
                        serverTimestamp()

                }
            );


            /* ============================
               SUCCESS
            ============================ */

            showMessage(
                "🎉 Celebrant published successfully! The pictures will remain live for 24 hours.",
                "success"
            );


            selectedFiles = [];

            photoInput.value = "";

            previewGrid.innerHTML = "";

            previewTitle.style.display =
                "none";

            celebrantName.value = "";


        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong while publishing. Please try again.",
                "error"
            );

        }


        publishBtn.disabled = false;

        publishBtn.textContent =
            "🎉 PUBLISH CELEBRANT";

        progress.style.display =
            "none";

    }
);

</script>

</body>
</html>
